version: "3.9"

services:

  training:

    build: .

    container_name: unsw_training

    volumes:
      - .:/app

    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlruns

    command: python -m src.train


  mlflow:

    image: python:3.10-slim

    container_name: mlflow_ui

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "5000:5000"

    command: >
      sh -c "pip install mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000"